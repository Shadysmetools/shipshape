# qa.config.yaml: per-project QA settings. Copy to your project root as qa.config.yaml.
# Secrets are NEVER written here: each channel names the ENV VAR that holds its secret.
project: demo-shop
base_url: http://127.0.0.1:8765/          # local or staging only
allow_hosts: [127.0.0.1, localhost]       # the recorder, load test and header check refuse anything else
live: false                               # true = a client's live site: the run stops before any input
narrator:
  provider: edge                          # used only without voice profiles: edge (free) | openai | elevenlabs
  lang: en                                # en | ar
  voice: en-US-AndrewNeural               # ar: ar-EG-ShakirNeural or ar-EG-SalmaNeural
  rate: "-5%"
  # Named voice profiles: pick one per run with --voice <name> (record.py, slides_video.py, narrator.py report/mix).
  # Use a cloned voice ONLY if its owner agreed (consent) to it narrating these videos.
  # A voice id is a literal or {env: NAME}; NAME is looked up through scripts/keys.py (env, keychain, user store).
  # API keys never go in this file: OPENAI_API_KEY / ELEVENLABS_API_KEY come from keys.py.
  # If a paid provider refuses (no key, HTTP 402 paid plan, offline), the free edge voice speaks instead and
  # results.json narration_note says why.
  default_voice: narrator                 # used when --voice is not given
  voices:
    narrator: {provider: edge, voice: en-US-AndrewNeural, lang: en}
    narrator-ar: {provider: edge, voice: ar-EG-SalmaNeural, lang: ar}
    # sara: {provider: elevenlabs, voice: {env: ELEVENLABS_VOICE_ID_SARA}, lang: ar}   # Sara's own cloned voice, with her consent
    # openai: {provider: openai, voice: alloy, lang: en}
loop:
  max_rounds: 3
  budget_minutes: 120
  passes: 2                               # every scenario twice; disagreement = FLAKY
issues:
  repo: Shadysmetools/shipshape           # where /qa-issue files ShipShape bugs and gaps (owner/repo; a team fork can point at its own)
video:                                  # short, to-the-point evidence videos (scripts/video_trim.py)
  type: standard                          # default type; a plan can set "video_type": "simple"
  max_seconds: 240                        # hard ceiling for every type (4 min)
  types: {simple: 60, standard: 150, walkthrough: 240}   # cap in seconds per kind of case
  trim: speed                             # speed | cut | off: what happens to still / idle stretches
  speed: 8                                # how much faster idle stretches play (trim: speed)
  min_idle_seconds: 2                     # shorter pauses are left alone
  keep_seconds: 0.5                       # still kept at each side of a trimmed stretch
# Optional public links (e.g. a private bucket or intranet path) used when a file is too big to attach
report_link_base: ""
video_link_base: ""
timesheet:
  mode: measured                          # measured (agent session time) | human (human-equivalent, from templates/human-rates.example.json)
  rule: ""                                # the team's billing rule in its own words; written into the workbook
  rates: ""                               # path to the team's rates JSON (empty = the template)
notify:
  telegram:
    enabled: false
    token: {env: TELEGRAM_BOT_TOKEN}
    chat_id: "<TELEGRAM_CHAT_ID>"           # placeholder
    topic_id: null                         # forum topic, optional
    lang: en
  whatsapp:
    enabled: false
    provider: meta                         # meta | twilio
    token: {env: WHATSAPP_TOKEN}
    phone_number_id: "<WHATSAPP_PHONE_NUMBER_ID>"
    to: ["+00 000 000 0000"]               # test recipients only
    template: {name: qa_run_summary, language: en}
    # twilio: account_sid: {env: TWILIO_ACCOUNT_SID}, auth_token: {env: TWILIO_AUTH_TOKEN}, from: "whatsapp:<TWILIO_NUMBER>"
  slack:
    enabled: false
    webhook_url: {env: SLACK_WEBHOOK_URL}
  email:
    enabled: false
    host: smtp.example.com
    port: 587
    from: qa-bot@example.com
    to: [team@example.com]
    password: {env: SMTP_PASSWORD}
  webhook:
    enabled: false
    url: {env: QA_WEBHOOK_URL}
  knowcap:                                 # upload the video + report to YOUR Knowcap project, get a Knowcap link back
    type: knowcap
    enabled: false
    api_key: {env: KNOWCAP_API_KEY}        # your own key (Knowcap > Settings > API Keys); saved with keys.py, never here
    project_id: "<KNOWCAP_PROJECT_ID>"     # placeholder: the project the video goes into
    folder_id: null                        # optional folder inside that project
    share: false                           # true = also make a public share link (a publish: needs the owner's OK)
    send_report: true                      # also upload report.html (best effort)
# Optional: Odoo tickets as QA input and output (scripts/odoo_ticket.py). Remove the block if you don't use Odoo.
# The API key is yours: env var ODOO_API_KEY or `python scripts/keys.py set ODOO_API_KEY` (asked for once when missing).
# It never goes in this file.
odoo:
  url: https://<your-odoo-host>               # https only (http is accepted for 127.0.0.1/localhost)
  db: <database>
  user: qa-bot@example.com                    # the Odoo login of the QA user that owns the API key
  model: helpdesk.ticket                      # or project.task
  # api_key: {env: ODOO_API_KEY}              # only to use another env var / key name
  trigger:
    stages: [Pending Internal Testing]        # `odoo_ticket.py watch` starts a run when a ticket enters one of these
    # entry_field: date_last_stage_update     # what tells one stage entry from the next
    # launch: [claude, -p, "/qa-goal {goal}"] # what a watch --launch starts ({goal}, {ticket}, {file})
  on_pass: Client Testing                     # stage after a passing run
  on_fail: In Progress                        # stage after a failing run
  auto_move: false                            # true = the hook guard lets `move --send` to on_pass/on_fail through without asking

# Crew roles and external agents (docs/CUSTOMIZE-AGENTS.md). Check with: python scripts/crew.py roles
agents:
  # Put your own agent in a kit role. Roles: code-reviewer, security-reviewer, automation-tester, load-tester,
  # live-regression, desktop-tester, demo-video, refuter, odoo-expert, timesheet. Unlisted roles keep the kit's agent.
  roles:
    odoo-expert: odoo-functional-consultant   # your .claude/agents/odoo-functional-consultant.md
  # Agents the crew may ASK when the expected behaviour is unclear. Every question and answer goes in the
  # ledger (qa_loop.py consult). No secrets here: a command reads its own credentials on its own machine.
  external:
    - name: odoo-consultant
      role: odoo-expert
      when: expected Odoo behaviour (accounting, stock, invoicing flows) is not written in the ticket
      subagent: odoo-functional-consultant    # a Claude Code agent name
    - name: ticket-analyst
      role: ticket-analyst
      when: the acceptance criteria of a ticket are missing or contradict each other
      session: ticket-analyst                 # a running Claude Code session, reached with SendMessage
    - name: internal-dev
      role: developer
      when: a failure might be intended behaviour of a recent change
      command: [python, tools/ask_dev.py]     # question on stdin, answer on stdout
