# qa.config.yaml: per-project QA settings. Copy to your project root as qa.config.yaml.
# Secrets are NEVER written here: each channel names the ENV VAR that holds its secret.
project: demo-shop
base_url: http://127.0.0.1:8765/          # local or staging only
allow_hosts: [127.0.0.1, localhost]       # the recorder, load test and header check refuse anything else
live: false                               # true = a client's live site: the run stops before any input
narrator:
  provider: edge                          # edge (free) | openai (OPENAI_API_KEY) | elevenlabs (ELEVENLABS_API_KEY)
  lang: en                                # en | ar
  voice: en-US-AndrewNeural               # ar: ar-EG-ShakirNeural or ar-EG-SalmaNeural
  rate: "-5%"
loop:
  max_rounds: 3
  budget_minutes: 120
  passes: 2                               # every scenario twice; disagreement = FLAKY
# Optional public links (e.g. a private bucket or intranet path) used when a file is too big to attach
report_link_base: ""
video_link_base: ""
notify:
  telegram:
    enabled: false
    token: {env: TELEGRAM_BOT_TOKEN}
    chat_id: "<TELEGRAM_CHAT_ID>"           # placeholder
    topic_id: null                         # forum topic, optional
    lang: en
  whatsapp:
    enabled: false
    provider: meta                         # meta | twilio
    token: {env: WHATSAPP_TOKEN}
    phone_number_id: "<WHATSAPP_PHONE_NUMBER_ID>"
    to: ["+00 000 000 0000"]               # test recipients only
    template: {name: qa_run_summary, language: en}
    # twilio: account_sid: {env: TWILIO_ACCOUNT_SID}, auth_token: {env: TWILIO_AUTH_TOKEN}, from: "whatsapp:<TWILIO_NUMBER>"
  slack:
    enabled: false
    webhook_url: {env: SLACK_WEBHOOK_URL}
  email:
    enabled: false
    host: smtp.example.com
    port: 587
    from: qa-bot@example.com
    to: [team@example.com]
    password: {env: SMTP_PASSWORD}
  webhook:
    enabled: false
    url: {env: QA_WEBHOOK_URL}
# Optional: Odoo tickets as QA input and output (scripts/odoo_ticket.py). Remove the block if you don't use Odoo.
# The API key is yours: env var ODOO_API_KEY or `python scripts/keys.py set ODOO_API_KEY` (asked for once when missing).
# It never goes in this file.
odoo:
  url: https://<your-odoo-host>               # https only (http is accepted for 127.0.0.1/localhost)
  db: <database>
  user: qa-bot@example.com                    # the Odoo login of the QA user that owns the API key
  model: helpdesk.ticket                      # or project.task
  # api_key: {env: ODOO_API_KEY}              # only to use another env var / key name
  trigger:
    stages: [Pending Internal Testing]        # `odoo_ticket.py watch` starts a run when a ticket enters one of these
    # entry_field: date_last_stage_update     # what tells one stage entry from the next
    # launch: [claude, -p, "/qa-goal {goal}"] # what a watch --launch starts ({goal}, {ticket}, {file})
  on_pass: Client Testing                     # stage after a passing run
  on_fail: In Progress                        # stage after a failing run
  auto_move: false                            # true = the hook guard lets `move --send` to on_pass/on_fail through without asking
